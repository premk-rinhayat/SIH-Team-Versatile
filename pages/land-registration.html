<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Frontend-only hackathon prototype for farmer-centric paddy procurement"
    />
    <title>Land Registration — PaddySetu</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/utility.css" />
    <link rel="stylesheet" href="../css/registration.css" />
  </head>
  <body>
    <div data-header></div>
    <main class="page-main">
      <div class="container">
        <div class="eyebrow">Step 2 • Land Registration / भूमि पंजीयन</div>
        <h1 class="page-title">Register agricultural land</h1>
        <div class="grid-2">
          <section class="card">
            <form id="landForm" class="form-grid">
              <div class="field">
                <label>State</label
                ><select name="state">
                  <option>Madhya Pradesh</option>
                </select>
              </div>
              <div class="field">
                <label>District</label
                ><select name="district">
                  <option>Bhopal</option>
                </select>
              </div>
              <div class="field">
                <label>Tehsil</label
                ><input name="tehsil" required value="Berasia" />
              </div>
              <div class="field">
                <label>Village</label
                ><input name="village" required value="Berasia" />
              </div>
              <div class="field">
                <label>Khasra Number</label
                ><input name="khasra" required placeholder="e.g. 308" />
              </div>
              <div class="field">
                <label>Land Area</label
                ><input
                  type="number"
                  step="0.01"
                  min="0.01"
                  name="area"
                  required
                />
              </div>
              <div class="field">
                <label>Area Unit</label
                ><select name="unit">
                  <option>Acre</option>
                  <option>Hectare</option>
                </select>
              </div>
              <div class="field">
                <label>Land Owner Name</label
                ><input name="owner" required value="Ramesh Patel" />
              </div>
              <div class="field">
                <label>Relation with Farmer</label
                ><select name="relation">
                  <option>Self</option>
                  <option>Father</option>
                  <option>Mother</option>
                  <option>Spouse</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="field">
                <label>Irrigation Type</label
                ><select name="irrigation">
                  <option>Tube Well</option>
                  <option>Canal</option>
                  <option>Rainfed</option>
                </select>
              </div>
              <div class="field full">
                <label>Land Type</label
                ><select name="landType">
                  <option>Irrigated</option>
                  <option>Rainfed</option>
                  <option>Mixed</option>
                </select>
              </div>
              <div class="field full">
                <button class="btn btn-primary btn-block">
                  Verify & Add Land
                </button>
              </div>
            </form>
            <div id="verificationPanel" class="verification-steps hidden mt-3">
              <div class="verification-item">
                <span class="verification-check">✓</span
                ><strong>Land Record Found</strong>
              </div>
              <div class="verification-item">
                <span class="verification-check">✓</span
                ><strong>Ownership Verified</strong>
              </div>
              <div class="verification-item">
                <span class="verification-check">✓</span
                ><strong>Land Added Successfully</strong>
              </div>
            </div>
          </section>
          <section class="card">
            <h2 class="section-title">Registered Lands</h2>
            <div id="landList" class="stack"></div>
            <div class="button-row">
              <a class="btn btn-primary btn-block" href="farmer-id.html"
                >Continue to Farmer ID</a
              >
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/land-registration.js"></script>
  </body>
</html>
